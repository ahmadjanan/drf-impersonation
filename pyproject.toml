[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drf-impersonation"
dynamic = ["version"]
description = "Header-based user impersonation for Django REST Framework, works with any DRF authentication class"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ahmad Ali" }]
keywords = ["django", "djangorestframework", "drf", "impersonation", "authentication", "admin", "support"]
dependencies = ["Django>=4.2", "djangorestframework>=3.14"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ahmadjanan/drf-impersonation"
Repository = "https://github.com/ahmadjanan/drf-impersonation"
Issues = "https://github.com/ahmadjanan/drf-impersonation/issues"
Changelog = "https://github.com/ahmadjanan/drf-impersonation/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openapi = ["drf-spectacular>=0.27"]
test = ["pytest", "pytest-django", "pytest-cov", "drf-spectacular>=0.27"]
lint = ["ruff", "mypy"]

[tool.setuptools.package-data]
drf_impersonation = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "drf_impersonation.__version__" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["drf_impersonation"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
