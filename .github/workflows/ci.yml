name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }} / DRF ${{ matrix.drf }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported versions.
          - { python: "3.10", django: "4.2", drf: "3.14" }
          - { python: "3.11", django: "4.2", drf: "3.16" }
          - { python: "3.12", django: "4.2", drf: "3.16" }
          - { python: "3.10", django: "5.2", drf: "3.18" }
          - { python: "3.11", django: "5.2", drf: "3.18" }
          - { python: "3.12", django: "5.2", drf: "3.18" }
          - { python: "3.13", django: "5.2", drf: "3.18" }
          - { python: "3.14", django: "5.2", drf: "3.18" }
          - { python: "3.12", django: "6.0", drf: "3.18" }
          - { python: "3.13", django: "6.0", drf: "3.18" }
          - { python: "3.14", django: "6.0", drf: "3.18" }
          - { python: "3.12", django: "6.1", drf: "3.18" }
          - { python: "3.13", django: "6.1", drf: "3.18" }
          - { python: "3.14", django: "6.1", drf: "3.18" }
          - { python: "3.15", django: "6.1", drf: "3.18" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Run tests
        run: >-
          uv run --no-project --python ${{ matrix.python }}
          --with "Django~=${{ matrix.django }}.0"
          --with "djangorestframework~=${{ matrix.drf }}.0"
          --with drf-spectacular --with pytest --with pytest-django
          -- python -W error::DeprecationWarning -m pytest

  quality:
    name: Lint, types and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --extra test --extra lint
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - name: Tests with 100% coverage
        run: uv run pytest --cov

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - name: Check metadata and README render on PyPI
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
